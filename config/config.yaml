paper:
  initial_equity: 10000.0
  currency: USDT

risk:
  risk_per_trade: 0.035
  daily_loss_limit: 0.12
  max_concurrent_risk: 0.15
  min_equity_floor: 5000.0
  max_notional_pct: 0.10

scanner:
  enabled: true
  min_volume_usdt: 500000
  min_change_pct: 3.0
  top_n: 5
  rescan_interval_minutes: 15

exit:
  quick_profit_pct: 0.004
  trailing_activation_pct: 0.002
  trailing_distance_pct: 0.0015
  time_stop_minutes: 5

decision:
  min_confidence: 0.70
  require_volume_confirm: true

orderbook:
  enabled: true
  depth_levels: 20

learning:
  enabled: true
  min_trades: 10

news:
  enabled: false

sentiment:
  enabled: false

database:
  path: "data/trades.db"

oracle:
  timeframe: "5m"
  confidence_threshold: 0.70

